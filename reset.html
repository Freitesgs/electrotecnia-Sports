<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restablecer contraseña · ElectroTecnia Sports</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#1269be,#052858 55%,#03152d);color:#102033}
 .card{width:min(420px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 30px 90px #0008;text-align:center}
 img{height:74px;width:auto;object-fit:contain;filter:drop-shadow(0 4px 10px #0003);margin-bottom:6px}
 h1{font-size:20px;margin:8px 0}
 p{font-size:12px;color:#6b7a8c;line-height:1.6;margin:8px 0 0}
 .fields{display:flex;flex-direction:column;gap:12px;margin-top:18px;text-align:left}
 label{font-size:10px;font-weight:900;color:#66768a}
 input{width:100%;border:1px solid #e5eaf1;border-radius:9px;padding:12px;font-size:11px;outline:0}
 input:focus{border-color:#74a9df;box-shadow:0 0 0 3px #0a67b112}
 .pw{position:relative}
 .pw input{padding-right:42px}
 .pweye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:15px;cursor:pointer}
 button.btn{width:100%;border:0;border-radius:9px;padding:13px;font-size:11px;font-weight:900;cursor:pointer;background:#0758ad;color:#fff}
 button.btn:active{opacity:.85}
 .msg{border-radius:10px;padding:12px;font-size:11px;line-height:1.6;margin-top:14px;display:none}
 .msg.ok{background:#eafaf3;color:#087c55;display:block}
 .msg.bad{background:#fff0f2;color:#a31b29;display:block}
 a{color:#0758ad;font-weight:900;font-size:11px;text-decoration:none;display:block;margin-top:14px}
 .hidden{display:none}
</style>
</head>
<body>
<div class="card">
 <img src="img/logo-liceo.png" alt="Logo del liceo">
 <h1>🔑 Restablecer contraseña</h1>
 <p>Crea una contraseña nueva para tu cuenta de ElectroTecnia Sports.</p>

 <div id="noconfig" class="msg bad hidden">
  Supabase no está configurado en <b>js/config.js</b>. La recuperación por correo necesita la base de datos conectada.
 </div>

 <div id="form" class="fields">
  <div><label>Nueva contraseña (mínimo 6 caracteres)</label>
   <div class="pw" style="margin-top:5px"><input id="p1" type="password" placeholder="••••••"><button type="button" class="pweye" onclick="eye('p1',this)">👁️</button></div>
  </div>
  <div><label>Confirmar nueva contraseña</label>
   <div class="pw" style="margin-top:5px"><input id="p2" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doReset()"><button type="button" class="pweye" onclick="eye('p2',this)">👁️</button></div>
  </div>
  <button class="btn" onclick="doReset()">Guardar contraseña nueva</button>
  <a href="index.html">← Volver a iniciar sesión</a>
 </div>

 <div id="msg" class="msg"></div>
</div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   RESTABLECER CONTRASEÑA (reset.html)
   Flujo: "¿Olvidaste tu contraseña?" -> Supabase envía el
   correo -> el usuario abre el enlace -> llega a ESTA página
   -> escribe la nueva contraseña -> listo.
   ============================================================ */
let sb=null;
function $(id){return document.getElementById(id)}
function eye(id,el){const i=$(id);const show=i.type==='password';i.type=show?'text':'password';el.textContent=show?'🙈':'👁️'}
function msg(t,ok){const m=$('msg');m.className='msg '+(ok?'ok':'bad');m.innerHTML=t}

(async function(){
 // Cliente de Supabase solo con los datos de js/config.js
 if(window.supabase&&CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY){
  const url=CONFIG.SUPABASE_URL.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');
  sb=window.supabase.createClient(url,CONFIG.SUPABASE_ANON_KEY.trim());
  // El enlace del correo llega con #access_token=...&type=password_recovery
  // supabase-js lo detecta solo y abre la sesión en esta página.
  const {data}=await sb.auth.getSession();
  if(!data?.session)msg('El enlace de recuperación expiró o ya fue usado.<br>Pide uno nuevo desde la app: <b>¿Olvidaste tu contraseña?</b>',false);
 }else{
  $('noconfig').classList.remove('hidden');
  $('form').classList.add('hidden');
 }
})();

async function doReset(){
 const p1=$('p1').value,p2=$('p2').value;
 if(p1.length<6)return msg('La contraseña debe tener al menos <b>6 caracteres</b>.',false);
 if(p1!==p2)return msg('Las contraseñas <b>no coinciden</b>.',false);
 if(!sb)return msg('Supabase no está configurado.',false);
 const {error}=await sb.auth.updateUser({password:p1});
 if(error)return msg(error.message.includes('different')?'La nueva contraseña debe ser <b>distinta</b> de la anterior.':error.message,false);
 $('form').classList.add('hidden');
 msg('✅ <b>Contraseña cambiada.</b> Ya puedes volver e iniciar sesión con tu nueva contraseña.',true);
}
</script>
</body>
</html>
